<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta content='width=device-width, initial-scale=1.0' name='viewport'>
    <title>Bot Framework Logs</title>
    <style>
        :root {
            --primary: #1a73e8;
            --primary-soft: #e8f0fe;
            --secondary: #1e8e3e;
            --secondary-light: #81c995;
            --danger: #d93025;
            --danger-soft: #fce9e8;
            --danger-soft-hover: #f8d2cc;
            --warning-dark: #b06000;
            --warning-soft: #fef7e0;
            --warning-soft-hover: #feefc3;
            --surface: #ffffff;
            --surface-2: #f8f9fa;
            --text-primary: #202124;
            --text-secondary: #5f6368;
            --border: #e0e3e7;
            --row-stripe: rgba(0, 0, 0, 0.018);
            --row-hover: rgba(26, 115, 232, 0.06);
            --shadow-2: 0 2px 6px rgba(60, 64, 67, 0.1), 0 8px 24px rgba(60, 64, 67, 0.12);
            --radius-sm: 6px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #8ab4f8;
                --primary-soft: #1f3a5f;
                --secondary: #81c995;
                --secondary-light: #a8dab5;
                --danger: #f28b82;
                --danger-soft: #3d2422;
                --danger-soft-hover: #5d342d;
                --warning-dark: #fdd663;
                --warning-soft: #3c3924;
                --warning-soft-hover: #4a4528;
                --surface: #1e1f22;
                --surface-2: #2b2d30;
                --text-primary: #e8eaed;
                --text-secondary: #9aa0a6;
                --border: #3c4043;
                --row-stripe: rgba(255, 255, 255, 0.025);
                --row-hover: rgba(138, 180, 248, 0.1);
                --shadow-2: 0 2px 6px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.5);
            }
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html {
            background-color: var(--surface);
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--surface);
            color: var(--text-primary);
            line-height: 1.5;
            font-size: 14px;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--surface);
        }

        th {
            padding: 14px 16px;
            background-color: var(--primary);
            color: white;
            position: -webkit-sticky;
            position: sticky;
            top: 0;
            text-align: left;
            font-weight: 600;
            font-size: 11px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            z-index: 10;
            white-space: nowrap;
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
            word-break: break-word;
        }

        td.message-cell {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            word-break: normal;
        }

        tbody tr {
            content-visibility: auto;
            contain-intrinsic-size: 0 48px;
            transition: background-color 0.15s ease;
        }

        tbody tr:nth-child(even) {
            background-color: var(--row-stripe);
        }

        tbody tr:hover {
            background-color: var(--row-hover);
            outline: 2px solid var(--primary);
            outline-offset: -2px;
        }

        tbody tr:has(td.level-WARN) {
            background-color: var(--warning-soft);
        }

        tbody tr:has(td.level-WARN):hover {
            background-color: var(--warning-soft-hover);
            outline-color: var(--warning-dark);
        }

        tbody tr:has(td.level-ERROR) {
            background-color: var(--danger-soft);
        }

        tbody tr:has(td.level-ERROR):hover {
            background-color: var(--danger-soft-hover);
            outline-color: var(--danger);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .level-INFO,
        .level-WARN,
        .level-ERROR {
            font-weight: 700;
            font-size: 11px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .level-INFO {
            color: var(--secondary);
        }

        .level-WARN {
            color: var(--warning-dark);
        }

        .level-ERROR {
            color: var(--danger);
        }

        td.level-INFO::before,
        td.level-WARN::before,
        td.level-ERROR::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: 1px;
            background-color: currentColor;
        }

        .ws-marker {
            color: var(--text-secondary);
            opacity: 0.55;
            user-select: none;
        }

        .ws-tab {
            font-size: 0.85em;
            margin-right: -0.4em;
        }

        .ws-nl {
            font-size: 0.85em;
            margin-left: 2px;
        }

        .ws-trail {
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        }

        .img-link,
        .vars-link {
            text-decoration: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }

        .img-link {
            display: inline-flex;
            align-items: center;
            padding: 0;
            position: relative;
        }

        .video-link .play-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 22px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
            pointer-events: none;
            border-radius: var(--radius-sm);
        }

        .video-unavailable .no-video-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            padding: 2px 5px;
            font-size: 9px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-secondary);
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            pointer-events: none;
            opacity: 0.92;
        }

        .img-link img {
            flex: 0 0 auto;
            display: block;
            width: 88px;
            height: 50px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background-color: var(--surface-2);
            object-fit: cover;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .img-link:hover img,
        .img-link:focus-visible img {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-soft);
        }

        .img-link:focus-visible {
            outline: none;
        }

        .img-link:hover::after,
        .img-link:focus-visible::after {
            content: "";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            /* min(75vw, 1280px) gives a near-HD preview centered on the
               viewport. On 1920x1080 displays this lands at 1280x720 with
               comfortable margins; on 1366 laptops it scales to ~1024x576.
               aspect-ratio: 16/9 matches typical screenshot proportions and
               removes the need for separate width/height tuning. */
            width: min(75vw, 1280px);
            aspect-ratio: 16 / 9;
            max-height: calc(100vh - 48px);
            border: 1px solid var(--border);
            background-color: var(--surface);
            background-image: var(--screenshot-preview);
            background-position: center;
            background-repeat: no-repeat;
            background-size: contain;
            box-shadow: var(--shadow-2);
            z-index: 1000;
            pointer-events: none;
        }

        .vars-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background-color: var(--secondary);
            color: white !important;
            font-size: 12px;
            letter-spacing: 0.02em;
        }

        .vars-link:hover,
        .vars-link:focus-visible {
            background-color: var(--secondary-light);
        }

        .vars-link:focus-visible {
            outline: 2px solid var(--secondary);
            outline-offset: 2px;
        }

        .variable-count {
            color: white !important;
        }

        @media (max-width: 1024px) {
            th, td {
                padding: 12px;
            }
        }

        @media (max-width: 768px) {
            body {
                font-size: 13px;
            }

            th, td {
                padding: 10px;
            }

            th {
                font-size: 10px;
            }

            .responsive-hide {
                display: none;
            }

            .img-link img {
                width: 64px;
                height: 40px;
            }

            .img-link:hover::after,
            .img-link:focus-visible::after {
                width: min(92vw, 720px);
                max-height: calc(100vh - 32px);
            }
        }

        @media (max-width: 480px) {
            th, td {
                padding: 8px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition: none !important;
            }
        }
    </style>
</head>
<body>
<table>
    <thead>
    <tr>
        <th>Datetime</th>
        <th>Level</th>
        <th>Source</th>
        <th class="responsive-hide">Machine</th>
        <th class="responsive-hide">User</th>
        <th>Message</th>
        <th>Variables</th>
        <th>Screen</th>
    </tr>
    </thead>
    <tbody>
